
name: Create Android Folder

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/create-android.yml'

permissions:
  contents: write

jobs:
  create-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android files
        run: flutter create --platforms=android --org com.mawlidati .

      - name: Save Android folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          git commit -m "Add Android project files" || echo "No changes"
          git push
