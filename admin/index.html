<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مولدتي | لوحة الإدارة</title>

<style>
*{box-sizing:border-box}
body{
  font-family:Arial,sans-serif;
  background:#f4f7f8;
  margin:0;
  padding:18px;
  color:#183b36;
}
.container{max-width:650px;margin:25px auto}
.card{
  background:white;
  padding:20px;
  margin-bottom:18px;
  border-radius:14px;
  box-shadow:0 3px 14px #0001;
}
h2{color:#008b72}
input,button{
  width:100%;
  padding:13px;
  margin:7px 0;
  border-radius:8px;
  font-size:16px;
}
input{border:1px solid #ccc}
button{
  border:0;
  background:#008b72;
  color:white;
  cursor:pointer;
}
.stop{background:#b83232}
.owner{
  border:1px solid #e1e8e6;
  padding:14px;
  border-radius:10px;
  margin-top:12px;
}
.hidden{display:none}
#message{color:#b83232}
.status{font-weight:bold}
</style>
</head>

<body>
<div class="container">

<div class="card">
<h2>مولدتي | لوحة الإدارة</h2>
<p>إدارة اشتراكات أصحاب المولدات</p>
</div>

<div class="card" id="loginBox">
<h2>دخول المدير</h2>

<input id="email" type="email"
placeholder="البريد الإلكتروني">

<input id="password" type="password"
placeholder="كلمة المرور">

<button onclick="login()">تسجيل الدخول</button>
<p id="message"></p>
</div>

<div id="dashboard" class="hidden">

<div class="card">
<h2>إضافة صاحب مولدة</h2>

<input id="ownerName"
placeholder="اسم صاحب المولدة">

<input id="ownerPhone"
placeholder="رقم الهاتف">

<label>تاريخ انتهاء الاشتراك</label>
<input id="expiryDate" type="date">

<button onclick="addOwner()">
إضافة صاحب مولدة
</button>
</div>

<div class="card">
<h2>أصحاب المولدات</h2>

<div id="ownersList">
جاري تحميل البيانات...
</div>

<button class="stop" onclick="logout()">
تسجيل الخروج
</button>
</div>

</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<script>

// إعدادات Firebase الخاصة بمشروع مولدتي

const firebaseConfig = {
  apiKey: "AIzaSyB5_7pTgiCPVch3NhrMifhvY9BpAZeAjBw",
  authDomain: "mawalidati-4db02.firebaseapp.com",
  databaseURL: "https://mawalidati-4db02-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "mawalidati-4db02",
  storageBucket: "mawalidati-4db02.firebasestorage.app",
  messagingSenderId: "728350015048",
  appId: "1:728350015048:web:98bb3128fe0a523e53e27d"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();


// تسجيل دخول المدير

function login(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if(!email || !password){
    alert("أدخل البريد الإلكتروني وكلمة المرور");
    return;
  }

  auth.signInWithEmailAndPassword(email,password)
  .catch(error=>{
    document.getElementById("message").textContent =
      "تعذر تسجيل الدخول: " + error.message;
  });
}


// متابعة حالة تسجيل الدخول

auth.onAuthStateChanged(user=>{

  if(user){

    document.getElementById("loginBox")
      .classList.add("hidden");

    document.getElementById("dashboard")
      .classList.remove("hidden");

    loadOwners();

  }else{

    document.getElementById("loginBox")
      .classList.remove("hidden");

    document.getElementById("dashboard")
      .classList.add("hidden");

  }

});


// تحميل أصحاب المولدات

function loadOwners(){

  const list = document.getElementById("ownersList");

  list.textContent = "جاري تحميل البيانات...";

  db.ref("generator_owners").on("value",snapshot=>{

    list.innerHTML = "";

    if(!snapshot.exists()){
      list.textContent = "لا يوجد أصحاب مولدات حالياً";
      return;
    }

    snapshot.forEach(child=>{

      const owner = child.val() || {};
      const id = child.key;

      const div = document.createElement("div");
      div.className = "owner";

      const title = document.createElement("h3");
      title.textContent = owner.name || "بدون اسم";

      const phone = document.createElement("p");
      phone.textContent =
        "رقم الهاتف: " + (owner.phone || "-");

      const status = document.createElement("p");
      status.className = "status";
      status.textContent =
        "حالة الاشتراك: " +
        (owner.subscription_status || "غير محدد");

      const expiry = document.createElement("p");
      expiry.textContent =
        "تاريخ الانتهاء: " + (owner.expiry_date || "-");

      const button = document.createElement("button");

      button.textContent =
        owner.subscription_status === "active"
        ? "إيقاف الاشتراك"
        : "تفعيل الاشتراك";

      button.className =
        owner.subscription_status === "active"
        ? "stop"
        : "";

      button.onclick = ()=>{
        toggleStatus(id,owner.subscription_status);
      };

      div.appendChild(title);
      div.appendChild(phone);
      div.appendChild(status);
      div.appendChild(expiry);
      div.appendChild(button);

      list.appendChild(div);

    });

  },error=>{

    list.textContent =
      "خطأ في تحميل البيانات: " + error.message;

  });

}


// إضافة صاحب مولدة

function addOwner(){

  const name =
    document.getElementById("ownerName").value.trim();

  const phone =
    document.getElementById("ownerPhone").value.trim();

  const expiry =
    document.getElementById("expiryDate").value;

  if(!name || !phone || !expiry){
    alert("يرجى إدخال جميع البيانات");
    return;
  }

  const id =
    db.ref("generator_owners").push().key;

  const today =
    new Date().toISOString().slice(0,10);

  db.ref("generator_owners/" + id).set({

    name:name,
    phone:phone,
    subscription_status:"active",
    start_date:today,
    expiry_date:expiry,
    grace_days:7

  }).then(()=>{

    alert("تمت إضافة صاحب المولدة بنجاح");

    document.getElementById("ownerName").value="";
    document.getElementById("ownerPhone").value="";
    document.getElementById("expiryDate").value="";

  }).catch(error=>{

    alert("تعذر إضافة صاحب المولدة: " + error.message);

  });

}


// تفعيل أو إيقاف الاشتراك

function toggleStatus(id,currentStatus){

  const newStatus =
    currentStatus === "active"
    ? "suspended"
    : "active";

  const confirmation = confirm(
    newStatus === "suspended"
    ? "هل تريد إيقاف اشتراك صاحب المولدة؟"
    : "هل تريد تفعيل اشتراك صاحب المولدة؟"
  );

  if(!confirmation) return;

  db.ref("generator_owners/" + id + "/subscription_status")
  .set(newStatus)
  .then(()=>{

    alert(
      newStatus === "active"
      ? "تم تفعيل الاشتراك"
      : "تم إيقاف الاشتراك"
    );

  })
  .catch(error=>{

    alert("حدث خطأ: " + error.message);

  });

}


// تسجيل الخروج

function logout(){
  auth.signOut();
}

</script>
</body>
</html>
