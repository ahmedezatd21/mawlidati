
workflows:
  mawldati-android:
    name: Mawlidati Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    scripts:
      - name: Show Flutter, Dart and Java versions
        script: |
          flutter --version
          dart --version
          java -version
          cd android
          ./gradlew --version
          cd ..

      - name: Get Flutter packages
        script: flutter pub get

      - name: Check project
        script: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Android APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
